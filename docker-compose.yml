version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
      - "5566:5566"
    volumes:
      - ./logs:/zhyn/logs
      - ./alarm_images:/zhyn/alarm_images
      - ./backups:/zhyn/backups
      - ./config:/zhyn/config
      - ./ssl:/zhyn/ssl
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "3"

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=oilfield
    ports:
      - "5432:5432"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "3"

volumes:
  postgres_data: 