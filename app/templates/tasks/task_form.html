{% extends 'base.html' %}

{% block title %}
    {% if task %}编辑任务{% else %}新建任务{% endif %}
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">{% if task %}编辑任务{% else %}新建任务{% endif %}</h3>
                    <div class="card-tools">
                        <a href="{{ url_for('tasks_view.index') }}" class="btn btn-secondary btn-sm">
                            <i class="fas fa-arrow-left"></i> 返回列表
                        </a>
                    </div>
                </div>
                <div class="card-body">
                    <!-- 结果展示区域 -->
                    <div id="resultMessage" class="alert" style="display: none;"></div>
                    
                    <form id="taskForm" method="post">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="task_name" class="form-label">任务名称</label>
                                    <input type="text" class="form-control" id="task_name" name="task_name" value="{{ task.task_name if task else '' }}" required {% if task %}readonly{% endif %}>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="task_type" class="form-label">任务类型</label>
                                    <select class="form-select" id="task_type" name="task_type" required {% if task %}disabled{% endif %}>
                                        <option value="" disabled selected>请选择任务类型</option>
                                        <option value="压力表读数" {% if task and task.task_type == '压力表读数' %}selected{% endif %}>压力表读数</option>
                                        <option value="液位计读数" {% if task and task.task_type == '液位计读数' %}selected{% endif %}>液位计读数</option>
                                        <option value="温度计读数" {% if task and task.task_type == '温度计读数' %}selected{% endif %}>温度计读数</option>
                                        <option value="启停检测" {% if task and task.task_type == '启停检测' %}selected{% endif %}>启停检测</option>
                                        <option value="皮带检测" {% if task and task.task_type == '皮带检测' %}selected{% endif %}>皮带检测</option>
                                        <option value="毛辫子检测" {% if task and task.task_type == '毛辫子检测' %}selected{% endif %}>毛辫子检测</option>
                                        <option value="井口泄漏检测" {% if task and task.task_type == '井口泄漏检测' %}selected{% endif %}>井口泄漏检测</option>
                                        <option value="烟火检测" {% if task and task.task_type == '烟火检测' %}selected{% endif %}>烟火检测</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="well_code" class="form-label">油井编号</label>
                                    <select class="form-select" id="well_code" name="well_code" {% if task %}disabled{% endif %}>
                                        <option value="">请选择油井编号</option>
                                        {% for well in oil_wells %}
                                        <option value="{{ well.well_code }}" {% if task and task.well_code == well.well_code %}selected{% endif %}>
                                            {{ well.well_code }} ({{ well.well_name }})
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="well_name" class="form-label">油井名称</label>
                                    <input type="text" class="form-control" id="well_name" name="well_name" value="{{ task.well_name if task else '' }}" required {% if task %}readonly{% endif %}>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="device_id" class="form-label">设备</label>
                                    <select class="form-select" id="device_id" name="device_id" required>
                                        <option value="" disabled selected>请选择设备</option>
                                        {% for device in devices %}
                                        <option value="{{ device.device_id }}" {% if task and task.device_id == device.device_id %}selected{% endif %}>
                                            {{ device.device_name }} ({{ device.ip_address }})
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="camera_ip" class="form-label">摄像头IP</label>
                                    <input type="text" class="form-control" id="camera_ip" name="camera_ip" value="{{ task.camera_ip if task else '' }}" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="camera_username" class="form-label">摄像头用户名</label>
                                    <input type="text" class="form-control" id="camera_username" name="camera_username" value="{{ task.camera_username if task else '' }}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="camera_password" class="form-label">摄像头密码</label>
                                    <input type="password" class="form-control" id="camera_password" name="camera_password" value="{{ task.camera_password if task else '' }}">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="camera_preset" class="form-label">摄像头预置点</label>
                                    <input type="number" class="form-control" id="camera_preset" name="camera_preset" min="1" max="255" value="{{ task.camera_preset if task else '1' }}" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="pressure_range" class="form-label">压力表量程</label>
                                    <input type="number" class="form-control" id="pressure_range" name="pressure_range" step="0.01" min="0" value="{{ task.pressure_range if task else '2.5' }}" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> 保存
                            </button>
                            <a href="{{ url_for('tasks_view.index') }}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> 取消
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{# 注释掉原有的JS拦截，使用原生表单提交 #}

{% endblock %}
