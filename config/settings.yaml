# 基础配置
debug_log_enabled: false
debug: false
secret_key: ${SECRET_KEY:-dev-key-123}

# Web服务器配置
web_server:
  host: 0.0.0.0
  port: 5000
  
# API服务器配置
api_server:
  host: 0.0.0.0
  port: 5566

# 数据库配置
database:
  user: admin
  password: admin123@Youtian
  host: db  # 使用Docker服务名
  port: 5432  # 使用容器内部端口
  name: oilfield_web_db

# 会话配置
session:
  permanent_lifetime_days: 7
  token_expiration_days: 1

# 日志配置
logging:
  path: /zhyn/logs
  main_log: oilfield.log
  db_log: db_init.log
  max_bytes: 52428800  # 50MB
  backup_count: 20
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"

# 应用配置
application:
  items_per_page: 20
  max_content_length: 16777216  # 16MB
  upload_folder: /zhyn/alarm_images
  allowed_extensions:
    - txt
    - pdf
    - png
    - jpg
    - jpeg
    - gif
    - csv
    - xlsx

# 安全配置
security:
  session_cookie_secure: true
  remember_cookie_secure: true
  session_cookie_httponly: true
  remember_cookie_httponly: true

# SSL配置
ssl:
  cert_file: /zhyn/ssl/web_cert.pem
  key_file: /zhyn/ssl/web_key.pem
  api_cert_file: /zhyn/ssl/api_cert.pem
  api_key_file: /zhyn/ssl/api_key.pem
  cert_dir: /zhyn/ssl