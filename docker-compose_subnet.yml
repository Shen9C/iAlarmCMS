services:
  app:
    image: oilfield-web:v1.0.0
    container_name: oilfield_web_app
    ports:
      - "8000:8000"
      - "8800:8800"
    volumes:
      - ./logs:/zhyn/logs
      - ./alarm_images:/zhyn/alarm_images
      - ./backups:/zhyn/backups
      - ./config:/zhyn/config
      - ./ssl:/zhyn/ssl
    environment:
      - PYTHONPATH=/zhyn
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - TZ=Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "3"

  db:
    image: postgres:latest
    container_name: oilfield_web_db
    environment:
      - POSTGRES_USER=guanliyuan
      - POSTGRES_PASSWORD=admin123_Youtian
      - POSTGRES_DB=oilfield_web_db
      - TZ=Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guanliyuan -d oilfield_web_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "3"
